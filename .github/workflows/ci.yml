name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build solution
        run: dotnet build GenerationSceneKii.sln --configuration Release
      - name: Check OSM import and scene export
        run: dotnet run --project tests/SceneGenerator.OpenStreetMap.Checks --configuration Release
      - name: Check import window logic without GUI
        run: dotnet run --project tests/SceneGenerator.OpenStreetMap.DesktopChecks --configuration Release -- --viewmodel-only
